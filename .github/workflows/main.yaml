name: testing PR

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build-and-test:
  # choosing the runner
    runs-on: ubuntu-latest
  # checking out the code to the runner
    steps:
      - name: Check out code
        uses: actions/checkout@v4
# ensure that the repo and the image name are in lower case (thats how github repo works)
      - name: Set lower case owner name and image tag
        run: |
          echo "OWNER_LC=${OWNER,,}" >> "$GITHUB_ENV"
          echo "IMAGE_NAME=ghcr.io/${OWNER,,}/${REPO_NAME}" >> "$GITHUB_ENV"
        env:
          OWNER: '${{ github.repository_owner }}'
          REPO_NAME: '${{ github.event.repository.name }}'
# setup docker inside the runner
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
# building the image (but not pushing it yet since thats a PR test only)
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ${{ env.IMAGE_NAME }}:latest
          load: true   # makes the image available to docker-compose below
# building the stack from the yaml file, and providing dummy env vars to use 
      - name: Start the stack
        run: docker compose -f docker-compose.yml up -d
        env:
          DB_NAME: testdb
          DB_USER: testuser
          DB_PASSWORD: testpass
# the second step here is to ensure that the api is running by sending a request to it 
      - name: Wait for API to be healthy
        run: |
          for i in {1..30}; do
            if curl -sf http://localhost:8080/health; then
              echo "API is healthy"
              exit 0
            fi
            echo "Waiting for API... ($i)"
            sleep 2
          done
          echo "API failed to become healthy in time"
          docker compose logs
          exit 1
# running full smoke tests with all the endpoints, the pipe FAILS if one of them fails
      - name: Run smoke test
        run: |
          # Health check (already covered by the wait step, but re-confirm)
          curl -sf http://localhost:8080/health

          # Create a user, capture the response to grab its ID
          USER_RESPONSE=$(curl -sf -X POST http://localhost:8080/users \
            -H "Content-Type: application/json" \
            -d '{"name": "smoke-test-user", "email": "smoke@test.com"}')

          echo "User created: $USER_RESPONSE"

          # Extract the user's id from the JSON response (requires jq)
          USER_ID=$(echo "$USER_RESPONSE" | jq -r '.id')

          if [ -z "$USER_ID" ] || [ "$USER_ID" == "null" ]; then
            echo "Failed to extract user ID from response"
            exit 1
          fi

          # List users, confirm the endpoint responds
          curl -sf http://localhost:8080/users

          # Create a notification for that user
          echo "Creating notification..."
          NOTIF_RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST http://localhost:8080/notifications \
            -H "Content-Type: application/json" \
            -d "{\"user_id\": \"$USER_ID\", \"message\": \"smoke test notification\"}")
          echo "Notification response: $NOTIF_RESPONSE"

          # List notifications for that user, confirm it worked
          echo "Listing notifications..."
          curl -s -w "\nHTTP_STATUS:%{http_code}" "http://localhost:8080/notifications?user_id=$USER_ID"

          echo "Smoke test passed"
# stop the stack after running the tests full, and get ready to push the changes 
      - name: Tear down stack
        if: always()
        run: docker compose down
# when pushing or merging the changes, we need to push an image to the registry 
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
# adding a name and a tag to the image
      - name: Push image with tags
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}